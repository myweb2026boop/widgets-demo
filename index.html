<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TuTooth</title>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.18.2/dist/index.js"></script>
<style>
  /* 基础样式保持不变... (与原来一致) */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: #e5e5e5; color: #333;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; overflow: hidden;
  }
  .phone-case {
    width: 100%; max-width: 400px; height: 800px; max-height: 95vh;
    background-color: #fff; border-radius: 40px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    overflow: hidden; position: relative; transition: all 0.3s ease;
  }
  .phone-case.is-fullscreen { max-width: 100%; height: 100vh; max-height: 100vh; border-radius: 0; box-shadow: none; }
  .phone-content { width: 100%; height: 100%; position: relative; background-color: #fff; }
  .screen { display: none; width: 100%; height: 100%; overflow-y: auto; position: absolute; top: 0; left: 0; background: #fff; }
  .screen::-webkit-scrollbar { display: none; }
  .screen.active { display: block; }
  .icon-svg { width: 16px; height: 16px; fill: currentColor; display: inline-block; vertical-align: middle; margin-right: 4px; }

  /* ... 原有其他样式 ... */

  /* ================= 简讯App 专属样式 ================= */
  #jianxunScreen { display: none; flex-direction: column; background: #fff; height: 100%; position: absolute; top: 0; left: 0; width: 100%; }
  #jianxunScreen.active { display: flex; }
  .jx-tab-content { flex: 1; overflow-y: auto; display: none; padding-bottom: 70px; }
  .jx-tab-content.active { display: block; }

  /* 底部导航栏 */
  .jx-bottom-nav {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 60px; background: #f7f7f7; border-top: 1px solid #e5e5e5;
    display: flex; justify-content: space-around; align-items: center; z-index: 999;
  }
  .jx-nav-item { display: flex; flex-direction: column; align-items: center; color: #7a7e83; font-size: 10px; flex: 1; padding: 8px 0; cursor: pointer; }
  .jx-nav-item.active { color: #07c160; }
  .jx-nav-item svg { width: 26px; height: 26px; margin-bottom: 2px; fill: currentColor; }

  /* 聊天列表相关 */
  .jx-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; background: #fff; position: sticky; top: 0; z-index: 10; }
  .jx-header .left { font-size: 16px; color: #333; cursor: pointer; }
  .jx-header .title { font-size: 17px; font-weight: 600; color: #000; }
  .jx-header .right { font-size: 24px; color: #333; display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; border: 1px solid #ddd; line-height: 1; background: #f0f0f0; padding-bottom: 2px; cursor: pointer; }
  .jx-search-bar { margin: 0 16px 10px; background: #ededed; border-radius: 8px; padding: 8px 12px; display: flex; align-items: center; font-size: 14px; color: #999; }
  .jx-search-bar svg { width: 16px; height: 16px; margin-right: 6px; fill: #999; }
  .jx-chat-list { border-top: 1px solid #f5f5f5; }
  .jx-chat-item { display: flex; padding: 12px 16px; border-bottom: 1px solid #f5f5f5; align-items: center; }
  .jx-chat-item:last-child { border-bottom: none; }
  .jx-chat-avatar { width: 48px; height: 48px; border-radius: 50%; background: #eee; margin-right: 12px; overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #ccc; }
  .jx-chat-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .jx-chat-info { flex: 1; overflow: hidden; }
  .jx-chat-info-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .jx-chat-name { font-size: 16px; color: #333; font-weight: 500; }
  .jx-chat-time { font-size: 12px; color: #b2b2b2; }
  .jx-chat-msg { font-size: 14px; color: #999; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  
  /* 朋友圈相关 */
  .jx-moments-header { position: relative; height: 180px; background: #121212; cursor: pointer; background-size: cover; background-position: center; background-repeat: no-repeat; }
  .jx-moments-user-info { position: relative; padding: 50px 24px 16px 24px; border-bottom: 1px solid #f0f0f0; background: #fff; }
  .jx-moments-avatar { position: absolute; top: -40px; right: 24px; width: 80px; height: 80px; border-radius: 50%; background: #f0f0f0; overflow: hidden; flex-shrink: 0; cursor: pointer; border: 2px solid #fff; z-index: 10; }
  .jx-moments-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .jx-moments-name { font-size: 20px; font-weight: 600; margin-bottom: 4px; color: #333; display: block; }
  .jx-moments-signature { font-size: 13px; color: #666; margin-bottom: 8px; display: block; }
  .jx-moments-join-date { font-size: 12px; color: #999; margin-bottom: 4px; display: block; }
  .jx-moments-post-count { font-size: 12px; color: #999; display: block; margin-bottom: 4px; }
  .jx-moments-add-btn { position: absolute; bottom: 18px; right: 24px; width: 28px; height: 28px; border-radius: 50%; background: #000; color: #fff; font-size: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.2); z-index: 10; padding-bottom: 2px; }

  /* 动态列表 */
  .jx-moments-posts { padding: 16px; background: #fff; min-height: 100px; }
  .jx-post { margin-bottom: 24px; border-bottom: 1px solid #f5f5f5; padding-bottom: 16px; position: relative; }
  .jx-post:last-child { border-bottom: none; }
  .jx-post-header { display: flex; flex-direction: column; align-items: flex-start; margin-bottom: 12px; }
  .jx-post-avatar { width: 44px; height: 44px; border-radius: 6px; background: #f8bbd0; overflow: hidden; margin-bottom: 8px; }
  .jx-post-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .jx-post-user { font-size: 16px; color: #576b95; font-weight: 600; }
  .jx-post-delete-btn { font-size: 12px; color: #ccc; cursor: pointer; padding: 4px; display: flex; align-items: center; transition: color 0.2s; }
  .jx-post-delete-btn:hover { color: #ff4757; }
  .jx-post-content { font-size: 15px; color: #333; line-height: 1.6; margin-bottom: 12px; white-space: pre-wrap; }
  .jx-post-images { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
  .jx-post-images img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 6px; }
  .jx-post-footer { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #b2b2b2; margin-bottom: 8px; }
  .jx-post-actions { display: flex; gap: 16px; }
  .jx-post-actions svg { width: 18px; height: 18px; fill: #b2b2b2; cursor: pointer; }
  .jx-post-actions svg.liked { fill: #ff4757; }
  .jx-post-visibility { font-size: 11px; color: #ccc; display: flex; align-items: center; }
  .jx-post-comments { background: #f7f7f7; border-radius: 4px; padding: 8px 10px; margin-top: 8px; font-size: 13px; }
  .jx-comment-item { margin-bottom: 4px; line-height: 1.4; }
  .jx-comment-item:last-child { margin-bottom: 0; }
  .jx-comment-user { color: #576b95; font-weight: 500; }
  .jx-comment-text { color: #333; }

  /* 通讯录相关 */
  .jx-contacts-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; background: #fff; position: sticky; top: 0; z-index: 10; }
  .jx-contacts-header .title { font-size: 17px; font-weight: 600; color: #000; flex: 1; text-align: center; }
  .jx-contacts-header .icon { font-size: 22px; color: #333; width: 24px; height: 24px; fill: #333; }
  .jx-contacts-search { margin: 0 16px 10px; background: #ededed; border-radius: 8px; padding: 8px 12px; display: flex; align-items: center; font-size: 14px; color: #999; }
  .jx-contacts-search svg { width: 16px; height: 16px; margin-right: 6px; fill: #999; }
  .jx-contacts-block { background: #fff; padding: 0 16px; }
  .jx-contact-item { display: flex; align-items: center; padding: 14px 0; border-bottom: 1px solid #f5f5f5; font-size: 16px; color: #333; }
  .jx-contact-item:last-child { border-bottom: none; }
  .jx-contact-icon { width: 22px; height: 22px; margin-right: 12px; fill: #576b95; }
  .jx-contact-letter { background: #f7f7f7; padding: 6px 16px; font-size: 14px; color: #888; font-weight: 600; }
  .jx-contact-user { display: flex; align-items: center; padding: 12px 16px; background: #fff; border-bottom: 1px solid #f5f5f5; }
  .jx-contact-avatar { width: 44px; height: 44px; border-radius: 6px; background: #eee; margin-right: 12px; overflow: hidden; flex-shrink: 0; }
  .jx-contact-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .jx-contact-info { flex: 1; }
  .jx-contact-name { font-size: 16px; color: #333; }
  .jx-contact-sub { font-size: 12px; color: #999; margin-top: 2px; }

  /* ================= “我” 界面专属样式 (P2风格) ================= */
  #jx-me { background: #f7f7f7; }
  .jx-me-profile {
    background: #fff;
    display: flex;
    align-items: center;
    padding: 20px 16px;
    margin-bottom: 12px;
    cursor: pointer;
  }
  .jx-me-avatar {
    width: 64px;
    height: 64px;
    border-radius: 12px;
    overflow: hidden;
    margin-right: 16px;
    background: #f0f0f0;
    flex-shrink: 0;
  }
  .jx-me-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .jx-me-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .jx-me-name {
    font-size: 20px;
    font-weight: 600;
    color: #000;
    margin-bottom: 4px;
    word-break: break-all;
  }
  .jx-me-wxid {
    font-size: 14px;
    color: #999;
    word-break: break-all;
  }
  .jx-me-qr-icon {
    width: 24px;
    height: 24px;
    fill: #c0c0c0;
    margin-left: 10px;
  }
  .jx-me-menu {
    background: #fff;
  }
  .jx-me-menu-item {
    display: flex;
    align-items: center;
    padding: 16px;
    border-bottom: 1px solid #f0f0f0;
    cursor: pointer;
  }
  .jx-me-menu-item:last-child {
    border-bottom: none;
  }
  .jx-me-menu-icon {
    width: 24px;
    height: 24px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-right: 14px;
    flex-shrink: 0;
    color: #fff;
  }
  .jx-me-menu-icon svg {
    width: 16px;
    height: 16px;
    fill: #fff;
  }
  .jx-me-menu-text {
    flex: 1;
    font-size: 16px;
    color: #333;
  }
  .jx-me-menu-arrow {
    width: 16px;
    height: 16px;
    fill: #c0c0c0;
  }
  .jx-me-bg-wallet { background: #1aad19; }
  .jx-me-bg-fav { background: #fa9d3b; }
  .jx-me-bg-emoji { background: #ffc107; }
  .jx-me-bg-settings { background: #576b95; }

  /* ================= 弹窗样式 ================= */
  .jx-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 10000; display: none; }
  .jx-modal.show { display: flex; }
  .jx-modal-content { background: #fff; width: 80%; max-width: 320px; border-radius: 12px; padding: 20px; text-align: center; max-height: 70vh; display: flex; flex-direction: column; }
  .jx-modal-content h3 { font-size: 16px; margin-bottom: 15px; color: #333; }
  .jx-modal-list { flex: 1; overflow-y: auto; margin-bottom: 15px; text-align: left; }
  .jx-modal-item { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; display: flex; align-items: center; gap: 10px; }
  .jx-modal-item:last-child { border-bottom: none; }
  .jx-modal-item img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
  .jx-modal-item span { font-size: 15px; color: #333; }
  .jx-modal-btn { margin-top: 10px; padding: 10px; background: #f0f0f0; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-size: 14px; font-weight: 500; color: #333; }
</style>
</head>
<body>

<div class="phone-case" id="phoneCase">
  <div class="phone-content" id="phoneContent">
    
    <!-- ... (原有主屏幕、音乐、播放器、人设、美化、世界书、设置等界面代码保持不变) ... -->

    <!-- ================= 8. 简讯App (仿微信) ================= -->
    <div id="jianxunScreen" class="screen">
      
      <!-- 页面1：聊天 (p1) -->
      <div id="jx-chats" class="jx-tab-content active">
        <div class="jx-header">
          <span class="left" onclick="closeScreen('jianxunScreen')">返回</span>
          <span class="title">消息</span>
          <span class="right" onclick="showPersonaSelector()">+</span>
        </div>
        <div class="jx-search-bar">
          <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          搜索消息或用户
        </div>
        <div class="jx-chat-list" id="jxChatList"></div>
      </div>

      <!-- 页面2：朋友圈 -->
      <div id="jx-moments" class="jx-tab-content">
        <div class="jx-moments-header" id="jxMomentsHeader" onclick="document.getElementById('momentsBgInput').click()">
          <input type="file" id="momentsBgInput" accept="image/*" style="display: none;">
        </div>
        
        <div class="jx-moments-user-info">
          <div class="jx-moments-avatar" onclick="document.getElementById('momentsAvatarInput').click()">
            <img id="momentsAvatarImg" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23f0f0f0'/%3E%3C/svg%3E" alt="avatar">
            <input type="file" id="momentsAvatarInput" accept="image/*" style="display: none;">
          </div>
          
          <div class="jx-moments-name editable-text" id="momentsName" data-placeholder="点击输入网名">你最近过得还好吗？</div>
          <div class="jx-moments-signature editable-text" id="momentsSignature" data-placeholder="点击输入个性签名">人在接近幸福的时候才最幸福</div>
          <div class="jx-moments-join-date editable-text" id="momentsJoinDate" data-placeholder="点击输入加入时间">2026年9月21日 加入</div>
          <div class="jx-moments-post-count" id="momentsPostCount">帖子数量 0</div>
          
          <div class="jx-moments-add-btn" onclick="openPublishScreen()">+</div>
        </div>

        <div class="jx-moments-posts" id="jx-moments-posts"></div>
      </div>

      <!-- 页面3：通讯录 -->
      <div id="jx-contacts" class="jx-tab-content">
        <div class="jx-contacts-header">
          <span style="width:24px;"></span>
          <span class="title">通讯录</span>
          <svg class="icon" viewBox="0 0 24 24"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </div>
        <div class="jx-contacts-search">
          <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          搜索
        </div>
        
        <div class="jx-contacts-block" style="margin-top: 8px;">
          <div class="jx-contact-item"><svg class="jx-contact-icon" viewBox="0 0 24 24"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>新的朋友</div>
          <div class="jx-contact-item"><svg class="jx-contact-icon" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>群组</div>
        </div>

        <div id="jxContactList" style="margin-top: 8px;"></div>
      </div>

      <!-- 页面4：我 (P2风格) -->
      <div id="jx-me" class="jx-tab-content">
        <!-- 顶部个人卡片 -->
        <div class="jx-me-profile" onclick="document.getElementById('jxMeAvatarInput').click()">
          <div class="jx-me-avatar">
            <img id="jxMeAvatarImg" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23f0f0f0'/%3E%3C/svg%3E" alt="头像">
          </div>
          <div class="jx-me-info">
            <div class="jx-me-name" id="jxMeNameText">Koi Buono</div>
            <div class="jx-me-wxid" id="jxMeWxIdText">微信号：Koi_Buono</div>
          </div>
          <svg class="jx-me-qr-icon" viewBox="0 0 24 24"><path d="M3 3h6v6H3V3zm2 2v2h2V5H5zm8-2h6v6h-6V3zm2 2v2h2V5h-2zM3 15h6v6H3v-6zm2 2v2h2v-2H5zm10-2h4v2h-4v-2zm0 4h4v2h-4v-2zm-2-4h2v6h-2v-6z"/></svg>
          <input type="file" id="jxMeAvatarInput" accept="image/*" style="display: none;">
        </div>
        
        <!-- 功能菜单（已删去相册和卡包） -->
        <div class="jx-me-menu">
          <div class="jx-me-menu-item" onclick="alert('钱包功能暂未开放')">
            <div class="jx-me-menu-icon jx-me-bg-wallet"><svg viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg></div>
            <span class="jx-me-menu-text">钱包</span>
            <svg class="jx-me-menu-arrow" viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
          </div>
          <div class="jx-me-menu-item" onclick="alert('收藏功能暂未开放')">
            <div class="jx-me-menu-icon jx-me-bg-fav"><svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg></div>
            <span class="jx-me-menu-text">收藏</span>
            <svg class="jx-me-menu-arrow" viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
          </div>
          <div class="jx-me-menu-item" onclick="alert('表情功能暂未开放')">

        <div class="jx-nav-item" onclick="switchJianxunTab('jx-moments', this)"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg><span>朋友圈</span></div>
        <div class="jx-nav-item" onclick="switchJianxunTab('jx-contacts', this)"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg><span>通讯录</span></div>

</div>

<script>
  // ================= 全局界面管理 =================
  function openScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
  }
  function closeScreen(currentScreenId, targetScreenId = 'mainScreen') {
    document.getElementById(currentScreenId).classList.remove('active');
    document.getElementById(targetScreenId).classList.add('active');
  }
  // ... 其他 open 函数 ...

  // ================= 简讯App 专属逻辑 =================
  let jianxunChats = [];

  function openJianxunApp() {
    openScreen('jianxunScreen');
    const defaultTab = document.querySelector('.jx-nav-item');
    switchJianxunTab('jx-chats', defaultTab);
    loadJianxunChats();
    renderJianxunChatList();
    loadMomentsData();
    renderJianxunContacts(); 
    renderMomentsPosts(); 
    loadJxMeProfile(); // 加载“我”的信息
  }

  function switchJianxunTab(tabId, navElement) {
    document.querySelectorAll('.jx-tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.jx-nav-item').forEach(el => el.classList.remove('active'));

    const targetTab = document.getElementById(tabId);
    if (targetTab) targetTab.classList.add('active');
    
    if (navElement) {
      navElement.classList.add('active');
    } else {
      const navs = document.querySelectorAll('.jx-nav-item');
      if (tabId === 'jx-chats') navs[0].classList.add('active');
      if (tabId === 'jx-moments') navs[1].classList.add('active');
      if (tabId === 'jx-contacts') { navs[2].classList.add('active'); renderJianxunContacts(); }
      if (tabId === 'jx-me') { navs[3].classList.add('active'); loadJxMeProfile(); }
    }
  }

  // ================= 加载“我”界面信息 =================
  function loadJxMeProfile() {
    const savedAvatar = localStorage.getItem('moments_avatar');
    const savedName = localStorage.getItem('moments_name') || 'Koi Buono';
    const savedWxId = localStorage.getItem('jx_wechat_id') || 'Koi_Buono';

    if (savedAvatar) {
      document.getElementById('jxMeAvatarImg').src = savedAvatar;
    } else {
      document.getElementById('jxMeAvatarImg').src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23f0f0f0'/%3E%3C/svg%3E";
    }
    document.getElementById('jxMeNameText').innerText = savedName;
    document.getElementById('jxMeWxIdText').innerText = '微信号：' + savedWxId;
  }

  // 绑定“我”界面的交互事件
  document.getElementById('jxMeAvatarInput').addEventListener('change', function(e) {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const base64 = ev.target.result;
      document.getElementById('jxMeAvatarImg').src = base64;
      try { 
        localStorage.setItem('moments_avatar', base64); 
        // 同步更新朋友圈头像
        if(document.getElementById('momentsAvatarImg')) document.getElementById('momentsAvatarImg').src = base64;
        // 同步更新聊天列表和通讯录的默认头像
        renderJianxunChatList();
        renderJianxunContacts();
        renderMomentsPosts();
      } catch(err){ alert('图片过大'); }
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('jxMeNameText').addEventListener('click', function() {
    const currentName = localStorage.getItem('moments_name') || 'Koi Buono';
    const newName = prompt('请输入新的网名：', currentName);
    if (newName !== null && newName.trim() !== '') {
      const finalName = newName.trim();
      localStorage.setItem('moments_name', finalName);
      this.innerText = finalName;
      // 同步更新朋友圈网名
      if(document.getElementById('momentsName')) document.getElementById('momentsName').innerText = finalName;
      // 重新渲染列表
      renderMomentsPosts();
    }
  });

  document.getElementById('jxMeWxIdText').addEventListener('click', function() {
    const currentWxId = localStorage.getItem('jx_wechat_id') || 'Koi_Buono';
    const newWxId = prompt('请输入新的微信号：', currentWxId);
    if (newWxId !== null && newWxId.trim() !== '') {
      const finalWxId = newWxId.trim();
      localStorage.setItem('jx_wechat_id', finalWxId);
      this.innerText = '微信号：' + finalWxId;
    }
  });

  // ================= 加载简讯聊天数据 =================
  function loadJianxunChats() {
    const data = localStorage.getItem('jianxun_chats');
    if (data) {
      try { jianxunChats = JSON.parse(data); } catch(e) { jianxunChats = []; }
    } else {
      jianxunChats = [];
    }
    if (!Array.isArray(jianxunChats)) jianxunChats = [];
  }

  // 渲染简讯聊天列表 (添加默认头像和网名支持)
  function renderJianxunChatList() {
    const list = document.getElementById('jxChatList');
    if (!list) return;

    const defaultAvatar = localStorage.getItem('moments_avatar') || '';
    const defaultName = localStorage.getItem('moments_name') || 'Koi Buono';

    if (jianxunChats.length === 0) {
      list.innerHTML = '<div style="text-align:center; padding:60px 20px; color:#999; font-size:14px;">暂无聊天记录<br>点击右上角“+”添加人设</div>';
      return;
    }

    list.innerHTML = jianxunChats.map((chat, index) => {
      const avatarUrl = chat.avatar || defaultAvatar;
      const nameText = chat.name || defaultName;
      
      return `
      <div class="jx-chat-item" onclick="alert('进入与 ${nameText} 的聊天界面（暂未开发）')">
        <div class="jx-chat-avatar">
          ${avatarUrl ? `<img src="${avatarUrl}">` : `<svg viewBox="0 0 24 24" fill="#ccc" width="24" height="24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>`}
        </div>
        <div class="jx-chat-info">
          <div class="jx-chat-info-top">
            <span class="jx-chat-name">${nameText}</span>
            <span class="jx-chat-time">刚刚</span>
          </div>
          <span class="jx-chat-msg">点击开始聊天</span>
        </div>
      </div>
      `;
    }).join('');
  }

  // ... 其他辅助函数如 getFirstLetter, renderJianxunContacts 等保持不变 ...
  
  // 更新 renderJianxunContacts 以支持默认头像
  function renderJianxunContacts() {
    loadPersonaList(); 
    const list = document.getElementById('jxContactList');
    if (!list) return;

    const defaultAvatar = localStorage.getItem('moments_avatar') || '';
    const defaultName = localStorage.getItem('moments_name') || 'Koi Buono';

    if (personaList.length === 0) {
      list.innerHTML = '<div style="text-align:center; padding:40px 20px; color:#999; font-size:14px;">通讯录为空<br>请先去人设App中添加人设</div>';
      return;
    }

    const grouped = {};
    personaList.forEach(p => {
      const name = p.name || defaultName;
      const letter = getFirstLetter(name);
      if (!grouped[letter]) grouped[letter] = [];
      grouped[letter].push({...p, name});
    });

    const sortedLetters = Object.keys(grouped).sort((a, b) => {
      if (a === '#') return 1;
      if (b === '#') return -1;
      return a.localeCompare(b);
    });

    list.innerHTML = sortedLetters.map(letter => {
      const users = grouped[letter].sort((a, b) => a.name.localeCompare(b.name, 'zh-CN'));
      return `
        <div class="jx-contact-letter">${letter}</div>
        ${users.map(u => {
          const avatarUrl = u.avatar || defaultAvatar;
          return `
          <div class="jx-contact-user">
            <div class="jx-contact-avatar">
              ${avatarUrl ? `<img src="${avatarUrl}">` : `<svg viewBox="0 0 24 24" fill="#ccc" width="24" height="24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>`}
            </div>
            <div class="jx-contact-info">
              <div class="jx-contact-name">${u.name}</div>
              <div class="jx-contact-sub">最近上线于 ${new Date().toLocaleDateString('zh-CN')}</div>
            </div>
          </div>
        `}).join('')}
      `;
    }).join('');
  }

  // ... 其他逻辑（朋友圈、发布等）保持不变 ...

</script>

</body>
</html>
