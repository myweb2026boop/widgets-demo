<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TuTooth</title>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: #e5e5e5; color: #333;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; overflow: hidden;
  }

  /* 手机外壳 */
  .phone-case {
    width: 100%; max-width: 400px; height: 800px; max-height: 95vh;
    background-color: #fff; border-radius: 40px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    overflow: hidden; position: relative; transition: all 0.3s ease;
  }
  .phone-case.is-fullscreen { max-width: 100%; height: 100vh; max-height: 100vh; border-radius: 0; box-shadow: none; }
  .phone-content { width: 100%; height: 100%; position: relative; background-color: #fff; }

  /* 通用界面隐藏类 */
  .screen { display: none; width: 100%; height: 100%; overflow-y: auto; position: absolute; top: 0; left: 0; background: #fff; }
  .screen::-webkit-scrollbar { display: none; }
  .screen.active { display: block; }

  /* 通用 SVG 样式 */
  .icon-svg { width: 16px; height: 16px; fill: currentColor; display: inline-block; vertical-align: middle; margin-right: 4px; }

  /* ============ 1. 主屏幕 ============ */
  #mainScreen { padding: 20px 0; }
  .container { width: 100%; max-width: 400px; padding: 0 16px; margin: 0 auto; }
  .top-nav { display: flex; align-items: center; gap: 10px; font-size: 14px; color: #4b7bec; margin-bottom: 16px; font-weight: 500; }
  .top-nav .divider { color: #c8d6e5; font-weight: 300; }
  .captcha-box { border: 1px solid #e1e1e1; border-radius: 6px; height: 150px; display: flex; align-items: center; justify-content: center; background-color: #fff; margin-bottom: 12px; position: relative; overflow: hidden; cursor: pointer; }
  .captcha-box img { width: 100%; height: 100%; object-fit: cover; display: none; }
  .input-box { border: 1px solid #e1e1e1; border-radius: 6px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; font-size: 15px; color: #b0b0b0; background-color: #fff; margin-bottom: 16px; }
  .input-box svg { width: 20px; height: 20px; stroke: #b0b0b0; }
  .widget-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px 12px; text-align: center; align-items: center; }
  .widget-item { display: flex; flex-direction: column; align-items: center; }
  .icon-box { width: 56px; height: 56px; border-radius: 14px; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; position: relative; overflow: hidden; }
  .icon-box svg { width: 30px; height: 30px; }
  .icon-box img { width: 100%; height: 100%; object-fit: cover; border-radius: 14px; display: block; }
  .widget-label { font-size: 12px; color: #2d3436; margin-top: 4px; }
  .bg-pink { background-color: #fde8ed; }
  .bg-green { background-color: #5cb85c; }
  .bg-yellow { background-color: #fdd835; }
  .bg-blue { background-color: #e3f2fd; }
  .bg-purple { background-color: #e1bee7; }
  .bg-skyblue { background-color: #bbdefb; }
  .bg-pink2 { background-color: #f8bbd0; }
  .bg-lightpink { background-color: #fce4ec; }
  .empty-cell { opacity: 0; pointer-events: none; }

  /* 组件样式 */
  .icon-box.uploadable-icon { width: 100%; aspect-ratio: 1 / 1; height: auto; border-radius: 20px; cursor: pointer; margin-bottom: 0; }
  .icon-box.uploadable-icon svg { width: 55%; height: 55%; }
  .icon-box.uploadable-icon img { width: 100%; height: 100%; object-fit: cover; border-radius: 20px; display: none; }
  .pig-icon { width: 110px; height: 110px; border-radius: 20px; cursor: pointer; transform: translateY(60px); }
  .pig-icon svg { width: 55%; height: 55%; }
  .pig-icon img { width: 100%; height: 100%; object-fit: cover; border-radius: 20px; display: none; }

  /* ============ 2. 音乐主页 ============ */
  #musicScreen { background: #f8f9fa; padding-bottom: 120px; }
  .music-top-bar { display: flex; justify-content: space-between; align-items: center; padding: 16px; background: transparent; position: relative; z-index: 10; }
  .music-top-bar svg { width: 24px; height: 24px; cursor: pointer; fill: #333; }
  
  .music-bg-area { height: 180px; position: relative; background: #eef0f3; display: flex; align-items: center; justify-content: center; background-size: cover; background-position: center; cursor: pointer; }
  
  .profile-card {
    background: #fff; border-radius: 20px; margin: -30px 16px 16px 16px; padding: 16px; position: relative; z-index: 5;
    box-shadow: 0 4px 20px rgba(0,0,0,0.05);
  }
  .profile-header { display: flex; align-items: center; margin-bottom: 16px; }
  .avatar-box { width: 60px; height: 60px; border-radius: 50%; background: #f0f0f0; display: flex; align-items: center; justify-content: center; margin-right: 12px; overflow: hidden; cursor: pointer; flex-shrink: 0; }
  .avatar-box img { width: 100%; height: 100%; object-fit: cover; }
  .avatar-box svg { width: 30px; height: 30px; fill: #ccc; }
  
  .profile-info { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .profile-info h2 { font-size: 18px; color: #333; display: inline-block; }
  .profile-info p { font-size: 12px; color: #666; display: block; }
  
  .edit-btn { background: #f0f0f0; border: none; border-radius: 12px; padding: 6px 12px; font-size: 12px; color: #333; cursor: pointer; }

  .stats-row { display: flex; justify-content: space-around; padding-top: 12px; border-top: 1px solid #f0f0f0; text-align: center; }
  .stat-item { display: flex; flex-direction: column; align-items: center; }
  .stat-item .num { font-size: 16px; font-weight: bold; color: #333; min-width: 20px; }
  .stat-item .label { font-size: 11px; color: #999; margin-top: 2px; }

  .music-list-card { background: #fff; border-radius: 20px; margin: 0 16px 16px 16px; padding: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
  .music-list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .music-list-header h3 { font-size: 16px; color: #333; }
  .upload-btn { background: #fff; border: 1px solid #ddd; border-radius: 12px; padding: 6px 12px; font-size: 12px; display: flex; align-items: center; gap: 4px; cursor: pointer; color: #333; }
  .upload-btn svg { width: 14px; height: 14px; fill: #333; }
  .music-list-empty { text-align: center; padding: 40px 0; color: #999; font-size: 14px; }

  .music-player-bar {
    position: absolute; bottom: 20px; left: 16px; right: 16px; height: 70px; 
    background: #fff; border-radius: 20px;
    display: flex; align-items: center; padding: 0 16px; z-index: 20;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1); cursor: pointer;
  }
  .bar-cover { width: 44px; height: 44px; border-radius: 8px; background: #f0f0f0; margin-right: 12px; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
  .bar-cover svg { width: 20px; height: 20px; fill: #ccc; }
  .bar-info { flex: 1; }
  .bar-info .title { font-size: 14px; font-weight: 500; color: #333; margin-bottom: 2px; display: block; }
  .bar-info .subtitle { font-size: 11px; color: #999; display: block; }
  .bar-controls { display: flex; align-items: center; gap: 16px; }
  .bar-controls svg { width: 24px; height: 24px; fill: #333; cursor: pointer; }

  /* ============ 3. 全屏播放器 ============ */
  #playerScreen { background: #fff; color: #333; padding: 16px; }
  .player-top-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; margin-bottom: 20px; }
  .player-top-bar svg { width: 24px; height: 24px; fill: #333; cursor: pointer; }
  
  .vinyl-container { display: flex; justify-content: center; align-items: center; margin: 30px 0 40px 0; }
  .vinyl-disc {
    width: 300px; height: 300px; border-radius: 50%; background: #111;
    position: relative; display: flex; justify-content: center; align-items: center;
    box-shadow: 0 0 60px rgba(0,0,0,0.4);
    animation: spin 20s linear infinite; animation-play-state: paused;
  }
  @keyframes spin { 100% { transform: rotate(360deg); } }
  
  .vinyl-ring-2, .vinyl-ring-3 { width: 100%; height: 100%; border-radius: 50%; display: flex; justify-content: center; align-items: center; }
  
  .vinyl-center {
    width: 220px; height: 220px; border-radius: 50%; background: #555;
    overflow: hidden; cursor: pointer; position: relative;
    display: flex; justify-content: center; align-items: center;
    border: 2px solid #fff;
  }
  .vinyl-center img { 
    width: 100%; height: 100%; object-fit: cover; border-radius: 50% !important; display: block; 
  }
  .vinyl-center svg { width: 40px; height: 40px; fill: #fff; opacity: 0.5; position: absolute; pointer-events: none; }

  .player-info { text-align: center; margin-bottom: 30px; }
  .player-info h2 { font-size: 20px; font-weight: 600; color: #333; margin-bottom: 6px; }
  .player-info p { font-size: 14px; color: #999; }

  .player-tools { display: flex; justify-content: space-between; align-items: center; padding: 0 10px; margin-bottom: 20px; }
  .player-tools svg { width: 22px; height: 22px; fill: #333; cursor: pointer; }

  .progress-area { display: flex; align-items: center; gap: 10px; margin-bottom: 40px; font-size: 12px; color: #999; }
  .progress-bar-container { flex: 1; height: 4px; background: #e0e0e0; border-radius: 2px; position: relative; cursor: pointer; }
  .progress-bar-fill { height: 100%; background: #333; border-radius: 2px; width: 0%; position: relative; }
  .progress-bar-fill::after { content: ''; position: absolute; right: -6px; top: -4px; width: 12px; height: 12px; background: #333; border-radius: 50%; }

  .player-controls { display: flex; justify-content: space-between; align-items: center; padding: 0 10px; margin-top: 20px; }
  .player-controls svg { width: 28px; height: 28px; fill: #333; cursor: pointer; }
  .play-pause-btn { width: 60px; height: 60px; background: #111; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; }
  .play-pause-btn svg { width: 28px; height: 28px; fill: #fff; }

  /* ============ 4. 人设界面 ============ */
  #personaScreen { background: #f7f8fa; padding-bottom: 30px; }
  .persona-header { display: flex; align-items: center; padding: 16px; background: #fff; border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 10; }
  .persona-header .back-btn { background: none; border: none; color: #4b7bec; font-size: 16px; cursor: pointer; padding: 4px 8px; font-weight: 500; }
  .persona-header h3 { flex: 1; text-align: center; font-size: 17px; font-weight: 600; padding-right: 48px; }
  .persona-body { padding: 16px; }
  .persona-toolbar { display: flex; gap: 10px; margin-bottom: 16px; }
  .persona-toolbar .btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; text-align: center; }
  .btn-primary { background: #4b7bec; color: #fff; }
  .btn-outline { background: #fff; border: 1px solid #4b7bec; color: #4b7bec; }
  .persona-list { display: flex; flex-direction: column; gap: 12px; }
  .persona-card {
    background: #fff; border-radius: 12px; padding: 16px;
    display: flex; align-items: center; gap: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.03); cursor: pointer;
    transition: transform 0.2s;
  }
  .persona-card:active { transform: scale(0.98); }
  .persona-card .avatar { width: 50px; height: 50px; border-radius: 50%; background: #f0f0f0; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .persona-card .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .persona-card .avatar svg { width: 24px; height: 24px; fill: #ccc; }
  .persona-card .info { flex: 1; overflow: hidden; }
  .persona-card .info h4 { font-size: 15px; color: #333; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* 【关键修改】让卡片摘要也支持换行显示 */
  .persona-card .info p { font-size: 12px; color: #999; white-space: pre-wrap; overflow: hidden; text-overflow: ellipsis; max-height: 36px; line-height: 1.5; }
  .persona-card .arrow { color: #ccc; font-size: 20px; }

  /* 人设编辑表单 */
  .persona-edit-view { display: none; background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
  .persona-edit-view.active { display: block; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; }
  .form-group input, .form-group textarea { width: 100%; border: 1px solid #ddd; border-radius: 8px; padding: 10px; font-size: 14px; outline: none; font-family: inherit; }
  .form-group input:focus, .form-group textarea:focus { border-color: #4b7bec; }
  
  /* 【关键修改】强化文本域对换行的支持 */
  .form-group textarea { 
    height: 180px; 
    resize: vertical; 
    white-space: pre-wrap; /* 保留换行与空白 */
    word-wrap: break-word;
  }
  
  .avatar-edit-box { width: 80px; height: 80px; border-radius: 50%; background: #f0f0f0; overflow: hidden; display: flex; align-items: center; justify-content: center; cursor: pointer; margin: 0 auto 10px auto; border: 2px solid #eee; }
  .avatar-edit-box img { width: 100%; height: 100%; object-fit: cover; }
  .avatar-edit-box svg { width: 30px; height: 30px; fill: #ccc; }
  .form-row { display: flex; gap: 10px; }
  .form-row .form-group { flex: 1; }
  .form-actions { display: flex; gap: 10px; margin-top: 20px; }
  .form-actions .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; }
  .btn-save { background: #4b7bec; color: #fff; }
  .btn-delete { background: #ff4757; color: #fff; }
  .btn-cancel { background: #f0f0f0; color: #333; }

  /* 空状态 */
  .empty-state { text-align: center; padding: 40px 0; color: #999; font-size: 14px; }

  /* ============ 5. 美化界面 ============ */
  #beautifyScreen { background: #f7f8fa; padding-bottom: 30px; }
  .beautify-header { display: flex; align-items: center; padding: 16px; background: #fff; border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 10; }
  .beautify-header .back-btn { background: none; border: none; color: #4b7bec; font-size: 16px; cursor: pointer; padding: 4px 8px; font-weight: 500; }
  .beautify-header h3 { flex: 1; text-align: center; font-size: 17px; font-weight: 600; padding-right: 48px; }
  .beautify-body { padding: 16px; }
  .section-card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
  .section-card h4 { font-size: 15px; color: #333; margin-bottom: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .btn-row { display: flex; gap: 10px; }
  .btn { flex: 1; padding: 10px 16px; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; text-align: center; }
  .btn-primary { background: #4b7bec; color: #fff; }
  .btn-danger { background: #ff4757; color: #fff; }
  .btn-success { background: #2ecc71; color: #fff; }
  .highlight-card { border: 2px solid #4b7bec; background: #f0f6ff; }
  .highlight-card h4 { color: #4b7bec; }
  .app-edit-item { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
  .app-edit-item:last-child { border-bottom: none; }
  .app-edit-preview { width: 44px; height: 44px; border-radius: 10px; background: #f0f0f0; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; margin-right: 12px; flex-shrink: 0; }
  .app-edit-preview img { width: 100%; height: 100%; object-fit: cover; display: none; }
  .app-edit-preview svg { width: 24px; height: 24px; }
  .app-edit-info { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .app-edit-info input { border: 1px solid #ddd; border-radius: 6px; padding: 6px 10px; font-size: 13px; width: 100%; outline: none; }
  .app-edit-actions { display: flex; flex-direction: column; gap: 4px; margin-left: 8px; }
  .app-edit-actions button { font-size: 11px; padding: 4px 8px; border: none; border-radius: 4px; cursor: pointer; background: #eef2ff; color: #4b7bec; white-space: nowrap; }
  .preset-input-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .preset-input-row input { flex: 1; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; outline: none; }
  .preset-select-row { display: flex; gap: 8px; }
  .preset-select-row select { flex: 1; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; outline: none; background: #fff; }

  /* 可编辑文字通用样式 */
  .editable-text { display: inline-block; min-width: 20px; min-height: 20px; cursor: pointer; line-height: 1.5; }
  .editable-text:empty::before { content: attr(data-placeholder); color: #b0b0b0; }
  .editable-text[contenteditable="true"] { background-color: #f0f0f0; outline: none; border-radius: 4px; padding: 2px 6px; box-shadow: none; color: #333; cursor: text; user-select: text; }
</style>
</head>
<body>

<div class="phone-case" id="phoneCase">
  <div class="phone-content" id="phoneContent">
    
    <!-- ================= 1. 主屏幕 ================= -->
    <div id="mainScreen" class="screen active">
      <div class="container">
        <div class="top-nav">
          <span id="nav-skip" class="editable-text" data-placeholder="点击输入">Skip</span>
          <span class="divider">|</span>
          <span id="nav-help" class="editable-text" data-placeholder="点击输入">Help</span>
          <span class="divider">|</span>
          <span id="nav-robot" class="editable-text" data-placeholder="点击输入">I ??? a robot</span>
        </div>

        <div class="captcha-box" id="captchaBox">
          <svg id="defaultIllustration" width="120" height="120" viewBox="0 0 120 120">
            <path d="M40 70 C30 70 25 80 25 95 L95 95 C95 80 90 70 80 70 Z" fill="#8b5a2b"/>
            <circle cx="60" cy="65" r="22" fill="#fce4ec"/>
            <path d="M38 65 C38 45 45 35 60 35 C75 35 82 45 82 65 C82 70 78 72 75 72 C78 60 75 50 60 50 C45 50 42 60 45 72 C42 72 38 70 38 65 Z" fill="#8b5a2b"/>
            <path d="M48 62 Q53 58 58 62" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
            <path d="M62 62 Q67 58 72 62" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
            <circle cx="45" cy="68" r="5" fill="#ffcdd2" opacity="0.6"/>
            <circle cx="75" cy="68" r="5" fill="#ffcdd2" opacity="0.6"/>
            <polygon points="45,85 75,85 65,115 55,115" fill="#2c3e50"/>
            <rect x="15" y="74" width="25" height="6" fill="#bdc3c7" rx="2"/>
            <rect x="15" y="68" width="6" height="18" fill="#bdc3c7" rx="1"/>
            <rect x="25" y="68" width="4" height="12" fill="#bdc3c7" rx="1"/>
            <path d="M45 85 L35 80" stroke="#fce4ec" stroke-width="6" stroke-linecap="round"/>
          </svg>
          <img id="uploadedImage" alt="User Uploaded Image">
          <input type="file" id="fileInput" accept="image/*" style="display: none;">
        </div>

        <div class="input-box">
          <span id="input-text" class="editable-text" data-placeholder="Enter the code">Enter the code</span>
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 6 6v2"/>
          </svg>
        </div>

        <div class="widget-grid">
          <div class="widget-item">
            <div class="icon-box bg-pink" id="app-icon-beautify" onclick="openScreen('beautifyScreen')">
              <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="#ffffff" stroke-width="2.5"/><line x1="5" y1="5" x2="19" y2="19" stroke="#f8bbd0" stroke-width="3" stroke-linecap="round"/></svg>
            </div>
            <span class="widget-label" id="label-beautify">美化</span>
          </div>

          <div class="widget-item">
            <div class="icon-box bg-green" id="app-icon-wechat">
              <svg viewBox="0 0 24 24" fill="#ffffff"><path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM8 10C8.55 10 9 10.45 9 11C9 11.55 8.55 12 8 12C7.45 12 7 11.55 7 11C7 10.45 7.45 10 8 10ZM16 10C16.55 10 17 10.45 17 11C17 11.55 16.55 12 16 12C15.45 12 15 11.55 15 11C15 10.45 15.45 10 16 10Z" /></svg>
            </div>
            <span class="widget-label" id="label-wechat">简讯</span>
          </div>

          <div class="widget-item">
            <div class="icon-box pig-icon uploadable-icon" data-key="icon_1">
              <svg viewBox="0 0 40 40" fill="none" stroke="#bcaaa4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 C10 6 6 14 6 22 C6 28 10 32 14 34 L14 38 L26 38 L26 34 C30 32 34 28 34 22 C34 14 30 6 20 6 Z" /></svg>
              <img class="uploaded-icon-img" alt="Uploaded Icon">
              <input type="file" class="icon-file-input" accept="image/*" style="display: none;">
            </div>
          </div>

          <div class="widget-item">
            <div class="icon-box bg-yellow" id="app-icon-qqmusic" onclick="openMusicApp()">
              <svg viewBox="0 0 24 24" fill="#000000"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
            </div>
            <span class="widget-label" id="label-qqmusic">音乐</span>
          </div>

          <div class="widget-item">
            <div class="icon-box bg-blue" id="app-icon-persona" onclick="openPersonaApp()">

<script>
  // ================= 全局界面管理 =================
  function openScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
  }
  function closeScreen(currentScreenId, targetScreenId = 'mainScreen') {
    document.getElementById(currentScreenId).classList.remove('active');
    document.getElementById(targetScreenId).classList.add('active');
  }
  function openMusicApp() { openScreen('musicScreen'); }
  function openPlayerScreen() { openScreen('playerScreen'); }
  function openPersonaApp() { 
    openScreen('personaScreen'); 
    renderPersonaList();
  }

  // ================= 本地存储数据初始化 =================
  const APP_ICON_KEY_PREFIX = 'app_icon_';
  const APP_NAME_KEY_PREFIX = 'app_name_';
  const MUSIC_KEY_PREFIX = 'music_';
  const PERSONA_KEY = 'persona_list';

  if(localStorage.getItem('app_name_qqmusic') === 'QQ音乐') localStorage.setItem('app_name_qqmusic', '音乐');
  if(localStorage.getItem('app_name_play') === '玩法') localStorage.setItem('app_name_play', '多功能');
  if(localStorage.getItem('app_name_wechat') === '微信') localStorage.setItem('app_name_wechat', '简讯');

  // ================= 主屏幕App图标与名字逻辑 =================
  const appList = [
    { id: 'beautify', name: '美化' }, { id: 'wechat', name: '简讯' },
    { id: 'qqmusic', name: '音乐' }, { id: 'persona', name: '人设' },
    { id: 'book', name: '世界书' }, { id: 'play', name: '多功能' },
    { id: 'clock', name: 'Clock' }, { id: 'instagram', name: 'Instagram' }
  ];
  function applyAppConfig() {
    appList.forEach(app => {
      const savedName = localStorage.getItem(APP_NAME_KEY_PREFIX + app.id) || app.name;
      const labelEl = document.getElementById('label-' + app.id);
      if (labelEl) labelEl.innerText = savedName;
      
      const savedIcon = localStorage.getItem(APP_ICON_KEY_PREFIX + app.id);
      if (savedIcon) {
        const iconBox = document.getElementById('app-icon-' + app.id);
        if (iconBox) iconBox.innerHTML = `<img src="${savedIcon}" alt="${app.name}">`;
      }
    });
  }
  applyAppConfig();

  // ================= 双击编辑文字逻辑 =================
  function initEditableTexts() {
    document.querySelectorAll('.editable-text').forEach(el => {
      const key = 'edit_' + el.id;
      const savedValue = localStorage.getItem(key);
      if (savedValue) el.innerText = savedValue;

      el.addEventListener('dblclick', function() {
        this.contentEditable = "true"; this.focus();
      });
      
      el.addEventListener('blur', function() {
        this.contentEditable = "false";
        let finalText = this.innerText.trim();
        if (finalText === '') {
          finalText = this.getAttribute('data-placeholder') || '点击输入';
          this.innerText = finalText;
        }
        try { localStorage.setItem(key, finalText); } catch(e){}
      });
    });
  }
  initEditableTexts();

  // ================= 组件图片上传 =================
  const uploadableIcons = document.querySelectorAll('.uploadable-icon');
  uploadableIcons.forEach(iconBox => {
    const fileInputIcon = iconBox.querySelector('.icon-file-input');
    const imgElement = iconBox.querySelector('.uploaded-icon-img');
    const svgElement = iconBox.querySelector('svg');
    const storageKey = 'uploaded_' + iconBox.getAttribute('data-key');
    iconBox.addEventListener('click', (e) => { if (e.target !== fileInputIcon) fileInputIcon.click(); });
    fileInputIcon.addEventListener('change', function(e) {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        const base64Image = event.target.result;
        svgElement.style.display = 'none'; imgElement.src = base64Image; imgElement.style.display = 'block';
        try { localStorage.setItem(storageKey, base64Image); } catch (err) {}
      };
      reader.readAsDataURL(file);
    });
    const savedIconImage = localStorage.getItem(storageKey);
    if (savedIconImage) { svgElement.style.display = 'none'; imgElement.src = savedIconImage; imgElement.style.display = 'block'; }
  });

  // 顶部大图上传
  const captchaBox = document.getElementById('captchaBox');
  const defaultIllustration = document.getElementById('defaultIllustration');

  function togglePlay() {

      audio.pause();
      document.getElementById('playIcon').style.display = 'block';

      document.getElementById('vinylDisc').style.animationPlayState = 'paused';
    } else {

      document.getElementById('vinylDisc').style.animationPlayState = 'running';
    }
    isPlaying = !isPlaying;
  }

  audio.addEventListener('timeupdate', () => {
    const current = audio.currentTime;
    const total = audio.duration || 0;
    if (total > 0) {
      const percent = (current / total) * 100;
      document.getElementById('progressBarFill').style.width = percent + '%';
      document.getElementById('currentTime').innerText = formatTime(current);
      document.getElementById('totalTime').innerText = formatTime(total);
    }
  });

  document.getElementById('progressBarContainer').addEventListener('click', (e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    const percent = (e.clientX - rect.left) / rect.width;
    if (audio.duration) {
      audio.currentTime = percent * audio.duration;
    }
  });

  function formatTime(seconds) {
    const m = Math.floor(seconds / 60).toString().padStart(2, '0');
    const s = Math.floor(seconds % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  // 【核心修复：统一换行符，确保导入格式不变】
  document.getElementById('personaFileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    // 准备默认数据
    let parsedData = {
      name: file.name.replace(/\.[^/.]+$/, ""),
      nickname: '', gender: '', age: '', details: ''
    };

    // 显示编辑表单并填充基础数据
    const showEditForm = () => {
      editingPersonaId = null;
      document.getElementById('personaName').value = parsedData.name;
      document.getElementById('personaNickname').value = parsedData.nickname;
      document.getElementById('personaGender').value = parsedData.gender;
      document.getElementById('personaAge').value = parsedData.age;
      document.getElementById('personaDetails').value = parsedData.details;
      tempAvatarBase64 = '';
      document.getElementById('personaAvatarImg').style.display = 'none';
      document.getElementById('personaAvatarSvg').style.display = 'block';
      document.getElementById('personaDeleteBtn').style.display = 'none';

      document.getElementById('personaEditView').classList.add('active');
      document.getElementById('personaList').style.display = 'none';
      document.getElementById('personaEmptyState').style.display = 'none';
    };

    // 统一处理换行符：将 Windows 的 \r\n 和 Mac 的 \r 统一换成 \n
    const normalizeText = (text) => {
      if (!text) return '';
      return text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    };

    if (file.name.endsWith('.docx')) {
      if (typeof mammoth === 'undefined') {
        alert('docx 解析库未加载，无法直接解析，请手动填写人设内容。');
        parsedData.details = '请手动粘贴或输入文档内容。';
        showEditForm();
        return;
      }
      
      const reader = new FileReader();
      reader.onload = function(evt) {
        const arrayBuffer = evt.target.result;
        mammoth.extractRawText({arrayBuffer: arrayBuffer})
          .then(function(result) {
            // 应用换行符标准化
            parsedData.details = normalizeText(result.value);
            showEditForm();
          })
          .catch(function(err) {
            console.error('Docx解析失败:', err);
            alert('docx 解析失败，可能文件损坏，请手动输入内容。');
            parsedData.details = '请手动粘贴或输入文档内容。';
            showEditForm();
          });
      };
      reader.readAsArrayBuffer(file);
    } else if (file.name.endsWith('.json')) {
      const reader = new FileReader();
      reader.onload = function(ev) {
        const content = ev.target.result;
        try {
          const jsonData = JSON.parse(content);
          parsedData.name = jsonData.name || jsonData.char_name || parsedData.name;
          parsedData.nickname = jsonData.nickname || jsonData.net_name || '';
          parsedData.gender = jsonData.gender || jsonData.sex || '';
          parsedData.age = jsonData.age || '';
          // 应用换行符标准化
          parsedData.details = normalizeText(jsonData.details || jsonData.description || jsonData.persona || content);
        } catch (err) {
          parsedData.details = normalizeText(content);
        }
        showEditForm();
      };
      reader.readAsText(file);
    } else if (file.name.endsWith('.txt')) {
      const reader = new FileReader();
      reader.onload = function(ev) {
        // 应用换行符标准化
        parsedData.details = normalizeText(ev.target.result);
        showEditForm();
      };
      reader.readAsText(file);
    } else {
      alert('仅支持 docx, json, txt 文件格式');
    }
    
    this.value = ''; 
  });

    const dataStr = localStorage.getItem('preset_' + name);
    if (!dataStr) return alert('未找到该预设');
    try {
      const data = JSON.parse(dataStr);
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key.startsWith('saved_') || key.startsWith('uploaded_') || key.startsWith('edit_') || 
            key.startsWith(APP_ICON_KEY_PREFIX) || key.startsWith(APP_NAME_KEY_PREFIX) || 
            key.startsWith(MUSIC_KEY_PREFIX) || key === PERSONA_KEY) {
          localStorage.removeItem(key);
        }
      }
      for (const key in data) {
        if (Object.prototype.hasOwnProperty.call(data, key)) {
          localStorage.setItem(key, data[key]);
        }

      if (key.startsWith('saved_') || key.startsWith('uploaded_') || key.startsWith('edit_') || 
          key.startsWith(APP_ICON_KEY_PREFIX) || key.startsWith(APP_NAME_KEY_PREFIX) || 
          key.startsWith(MUSIC_KEY_PREFIX) || key === PERSONA_KEY) {
        data[key] = localStorage.getItem(key);
      }
    }
    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `ai_phone_beautify_${new Date().getTime()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    setTimeout(() => {
      if (confirm("配置导出成功！\n\n如果您的手机没有直接下载文件，请点击“确定”后，长按下方代码进行复制保存。\n\n（如果已经成功下载，请忽略此提示）")) {
        prompt("请长按复制以下美化配置代码（建议保存到备忘录）：", json);
      }
    }, 500);
  });

  document.getElementById('importDataBtn').addEventListener('click', () => {
    document.getElementById('importDataInput').click();
  });

  document.getElementById('importDataInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(event) {
      try {
        const data = JSON.parse(event.target.result);
        if (typeof data !== 'object' || data === null) throw new Error('Invalid JSON format');
        for (const key in data) {
          if (Object.prototype.hasOwnProperty.call(data, key)) {
            localStorage.setItem(key, data[key]);
          }
        }
        alert('导入成功！页面即将重新加载以应用新的美化配置。');
        location.reload();
      } catch (err) {
        alert('导入失败，文件内容可能损坏或不是合法的 JSON 文件。');
      }
    };
    reader.readAsText(file);
    this.value = ''; 
  });
</script>

</body>
</html>
