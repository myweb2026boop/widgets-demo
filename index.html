<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TuTooth</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: #e5e5e5;
    color: #333;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }

  .phone-case {
    width: 100%;
    max-width: 400px;
    height: 800px;
    max-height: 95vh;
    background-color: #fff;
    border-radius: 40px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    overflow: hidden;
    position: relative;
    transition: all 0.3s ease;
  }

  .phone-case.is-fullscreen {
    max-width: 100%;
    height: 100vh;
    max-height: 100vh;
    border-radius: 0;
    box-shadow: none;
  }

  .phone-content {
    width: 100%;
    height: 100%;
    position: relative;
    background-color: #fff;
  }

  #mainScreen {
    width: 100%;
    height: 100%;
    overflow-y: auto;
    padding: 20px 0;
    background-size: cover;
    background-position: center;
    background-color: #fff;
    display: block;
  }
  
  #mainScreen::-webkit-scrollbar { display: none; }

  #beautifyScreen {
    display: none;
    width: 100%;
    height: 100%;
    background-color: #f7f8fa;
    overflow-y: auto;
    padding-bottom: 30px;
    position: absolute;
    top: 0; left: 0;
  }
  #beautifyScreen::-webkit-scrollbar { display: none; }

  .beautify-header {
    display: flex;
    align-items: center;
    padding: 16px;
    background: #fff;
    border-bottom: 1px solid #eee;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .beautify-header .back-btn {
    background: none;
    border: none;
    color: #4b7bec;
    font-size: 16px;
    cursor: pointer;
    padding: 4px 8px;
    font-weight: 500;
  }
  .beautify-header h3 {
    flex: 1;
    text-align: center;
    font-size: 17px;
    font-weight: 600;
    padding-right: 48px;
  }

  .beautify-body {
    padding: 16px;
  }

  .section-card {
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.03);
  }
  .section-card h4 {
    font-size: 15px;
    color: #333;
    margin-bottom: 12px;
    font-weight: 600;
  }

  .btn-row {
    display: flex;
    gap: 10px;
  }
  .btn {
    flex: 1;
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    text-align: center;
  }
  .btn-primary { background: #4b7bec; color: #fff; }
  .btn-danger { background: #ff4757; color: #fff; }
  .btn-success { background: #2ecc71; color: #fff; }
  .btn-default { background: #f0f0f0; color: #333; }

  .app-edit-item {
    display: flex;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid #f0f0f0;
  }
  .app-edit-item:last-child { border-bottom: none; }
  
  .app-edit-preview {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    background: #f0f0f0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    cursor: pointer;
    margin-right: 12px;
    flex-shrink: 0;
  }
  .app-edit-preview img {
    width: 100%; height: 100%; object-fit: cover; display: none;
  }
  .app-edit-preview svg {
    width: 24px; height: 24px;
  }

  .app-edit-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .app-edit-info input {
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
    width: 100%;
    outline: none;
  }
  .app-edit-info input:focus { border-color: #4b7bec; }

  .app-edit-actions {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-left: 8px;
  }
  .app-edit-actions button {
    font-size: 11px;
    padding: 4px 8px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    background: #eef2ff;
    color: #4b7bec;
    white-space: nowrap;
  }

  .preset-input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .preset-input-row input {
    flex: 1;
    padding: 8px 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 13px;
    outline: none;
  }
  .preset-select-row {
    display: flex;
    gap: 8px;
  }
  .preset-select-row select {
    flex: 1;
    padding: 8px 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 13px;
    outline: none;
    background: #fff;
  }

  /* 主屏幕原有样式 */
  .container {
    width: 100%;
    max-width: 400px;
    padding: 0 16px;
    margin: 0 auto;
  }
  .top-nav {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    color: #4b7bec;
    margin-bottom: 16px;
    font-weight: 500;
  }
  .top-nav .divider {
    color: #c8d6e5;
    font-weight: 300;
  }
  .captcha-box {
    border: 1px solid #e1e1e1;
    border-radius: 6px;
    height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #fff;
    margin-bottom: 12px;
    position: relative;
    overflow: hidden;
    cursor: pointer;
  }
  .captcha-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
  }
  .input-box {
    border: 1px solid #e1e1e1;
    border-radius: 6px;
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 15px;
    color: #b0b0b0;
    background-color: #fff;
    margin-bottom: 16px; 
  }
  .input-box svg {
    width: 20px;
    height: 20px;
    stroke: #b0b0b0;
  }
  .widget-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px 12px;
    text-align: center;
    align-items: center; 
  }
  .widget-item {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .icon-box {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 8px;
    position: relative;
    overflow: hidden; 
  }
  .icon-box svg {
    width: 30px;
    height: 30px;
  }
  .icon-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 14px;
    display: block;
  }
  .widget-label {
    font-size: 12px;
    color: #2d3436;
    margin-top: 4px;
  }
  .bg-pink { background-color: #fde8ed; }
  .bg-green { background-color: #5cb85c; }
  .bg-yellow { background-color: #fdd835; }
  .bg-blue { background-color: #e3f2fd; }
  .bg-purple { background-color: #e1bee7; }
  .bg-skyblue { background-color: #bbdefb; }
  .bg-pink2 { background-color: #f8bbd0; }
  .bg-lightpink { background-color: #fce4ec; }
  .empty-cell { opacity: 0; pointer-events: none; }
  .editable-text[contenteditable="true"] {
    outline: 2px dashed #4b7bec;
    outline-offset: 2px;
    border-radius: 4px;
    background: rgba(75, 123, 236, 0.05);
    cursor: text;
    user-select: text;
  }
  
  /* 组件专用样式 */
  .icon-box.uploadable-icon {
    width: 100%;           
    aspect-ratio: 1 / 1;   
    height: auto;          
    border-radius: 20px;   
    cursor: pointer;
    margin-bottom: 0;      
  }
  .icon-box.uploadable-icon svg {
    width: 55%; 
    height: 55%;
  }
  .icon-box.uploadable-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover; 
    border-radius: 20px;
    display: none;
  }
  .pig-icon {
    width: 110px;
    height: 110px;
    border-radius: 20px;
    cursor: pointer;
    transform: translateY(60px);
  }
  .pig-icon svg {
    width: 55%; 
    height: 55%;
  }
  .pig-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover; 
    border-radius: 20px;
    display: none;
  }
</style>
</head>
<body>

<div class="phone-case" id="phoneCase">
  <div class="phone-content" id="phoneContent">
    
    <!-- ================= 主屏幕 ================= -->
    <div id="mainScreen">
      <div class="container">
        <div class="top-nav">
          <span id="nav-skip" class="editable-text">Skip</span>
          <span class="divider">|</span>
          <span id="nav-help" class="editable-text">Help</span>
          <span class="divider">|</span>
          <span id="nav-robot" class="editable-text">I ??? a robot</span>
        </div>

        <div class="captcha-box" id="captchaBox">
          <svg id="defaultIllustration" width="120" height="120" viewBox="0 0 120 120">
            <path d="M40 70 C30 70 25 80 25 95 L95 95 C95 80 90 70 80 70 Z" fill="#8b5a2b"/>
            <circle cx="60" cy="65" r="22" fill="#fce4ec"/>
            <path d="M38 65 C38 45 45 35 60 35 C75 35 82 45 82 65 C82 70 78 72 75 72 C78 60 75 50 60 50 C45 50 42 60 45 72 C42 72 38 70 38 65 Z" fill="#8b5a2b"/>
            <path d="M48 62 Q53 58 58 62" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
            <path d="M62 62 Q67 58 72 62" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
            <circle cx="45" cy="68" r="5" fill="#ffcdd2" opacity="0.6"/>
            <circle cx="75" cy="68" r="5" fill="#ffcdd2" opacity="0.6"/>
            <polygon points="45,85 75,85 65,115 55,115" fill="#2c3e50"/>
            <rect x="15" y="74" width="25" height="6" fill="#bdc3c7" rx="2"/>
            <rect x="15" y="68" width="6" height="18" fill="#bdc3c7" rx="1"/>
            <rect x="25" y="68" width="4" height="12" fill="#bdc3c7" rx="1"/>
            <path d="M45 85 L35 80" stroke="#fce4ec" stroke-width="6" stroke-linecap="round"/>
          </svg>
          <img id="uploadedImage" alt="User Uploaded Image">
          <input type="file" id="fileInput" accept="image/*" style="display: none;">
        </div>

        <div class="input-box">
          <span id="input-text" class="editable-text">Enter the code</span>
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 14L4 9l5-5"/>
            <path d="M4 9h10a6 6 0 0 1 6 6v2"/>
          </svg>
        </div>

        <div class="widget-grid">
          <div class="widget-item">
            <div class="icon-box bg-pink" id="app-icon-beautify" onclick="openBeautifyApp(event)">
              <svg viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="10" stroke="#ffffff" stroke-width="2.5"/>
                <line x1="5" y1="5" x2="19" y2="19" stroke="#f8bbd0" stroke-width="3" stroke-linecap="round"/>
              </svg>
            </div>
            <span class="widget-label" id="label-beautify">美化</span>
          </div>

          <div class="widget-item">
            <div class="icon-box bg-green" id="app-icon-wechat">
              <svg viewBox="0 0 24 24" fill="#ffffff">
                <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM8 10C8.55 10 9 10.45 9 11C9 11.55 8.55 12 8 12C7.45 12 7 11.55 7 11C7 10.45 7.45 10 8 10ZM16 10C16.55 10 17 10.45 17 11C17 11.55 16.55 12 16 12C15.45 12 15 11.55 15 11C15 10.45 15.45 10 16 10Z" />
              </svg>
            </div>
            <span class="widget-label" id="label-wechat">微信</span>
          </div>

          <!-- 小猪组件（不参与App列表） -->
          <div class="widget-item">
            <div class="icon-box pig-icon uploadable-icon" data-key="icon_1">
              <svg viewBox="0 0 40 40" fill="none" stroke="#bcaaa4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 6 C10 6 6 14 6 22 C6 28 10 32 14 34 L14 38 L26 38 L26 34 C30 32 34 28 34 22 C34 14 30 6 20 6 Z" />
              </svg>
              <img class="uploaded-icon-img" alt="Uploaded Icon">
              <input type="file" class="icon-file-input" accept="image/*" style="display: none;">
            </div>
          </div>

          <div class="widget-item">
            <div class="icon-box bg-yellow" id="app-icon-qqmusic">
              <svg viewBox="0 0 24 24" fill="#000000">
                <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
              </svg>
            </div>
            <span class="widget-label" id="label-qqmusic">QQ音乐</span>
          </div>

          <div class="widget-item">
            <div class="icon-box bg-blue" id="app-icon-persona">
              <svg viewBox="0 0 24 24" fill="#2196f3">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
              </svg>
            </div>
            <span class="widget-label" id="label-persona">人设</span>
          </div>

          <div class="widget-item empty-cell">
            <div class="icon-box"></div>
          </div>

          <!-- 哭脸组件（不参与App列表） -->
          <div class="widget-item">
            <div class="icon-box uploadable-icon" data-key="icon_2">
              <svg viewBox="0 0 40 40" fill="none" stroke="#bcaaa4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 6 C10 6 6 14 6 22 C6 28 10 32 14 34 L14 38 L26 38 L26 34 C30 32 34 28 34 22 C34 14 30 6 20 6 Z" />
              </svg>
              <img class="uploaded-icon-img" alt="Uploaded Icon">
              <input type="file" class="icon-file-input" accept="image/*" style="display: none;">
            </div>
          </div>

          <div class="widget-item">
            <div class="icon-box bg-purple" id="app-icon-book">
              <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="5" y="3" width="14" height="18" rx="2"/>
                <path d="M12 3v18"/>
                <path d="M9 7h6"/>
                <path d="M9 11h6"/>
                <path d="M9 15h6"/>
              </svg>
            </div>
            <span class="widget-label" id="label-book">世界书</span>
          </div>

          <div class="widget-item">
            <div class="icon-box bg-skyblue" id="app-icon-play"></div>
            <span class="widget-label" id="label-play">玩法</span>
          </div>

          <div class="widget-item empty-cell">
            <div class="icon-box"></div>
          </div>

          <div class="widget-item">
            <div class="icon-box bg-pink2" id="app-icon-clock">
              <svg viewBox="0 0 24 24" fill="#f48fb1">
                <circle cx="12" cy="12" r="10"/>
                <circle cx="8" cy="10" r="1.5" fill="#333333"/>
                <circle cx="16" cy="10" r="1.5" fill="#333333"/>
                <ellipse cx="12" cy="15" rx="3" ry="2" fill="#333333"/>
              </svg>
            </div>
            <span class="widget-label" id="label-clock">Clock</span>
          </div>

          <div class="widget-item">
            <div class="icon-box bg-lightpink" id="app-icon-instagram"></div>
            <span class="widget-label" id="label-instagram">Instagram</span>
          </div>
        </div>
      </div>
    </div>

    <!-- ================= 全屏美化界面 ================= -->
    <div id="beautifyScreen">
      <div class="beautify-header">
        <button class="back-btn" id="backToMainBtn">← 返回</button>
        <h3>美化设置</h3>
      </div>

      <div class="beautify-body">
        <!-- 1. 主页壁纸 -->
        <div class="section-card">
          <h4>🖼️ 主页壁纸</h4>
          <div class="btn-row">
            <button class="btn btn-primary" id="changeWallpaperBtn">更换壁纸</button>
            <button class="btn btn-danger" id="clearWallpaperBtn">清除壁纸</button>
          </div>
          <input type="file" id="wallpaperInput" accept="image/*" style="display: none;">
        </div>

        <!-- 2. App图标与名字（只有真正的App，不含组件） -->
        <div class="section-card">
          <h4>📱 App图标与名字</h4>
          <div id="appEditList">
            <!-- 动态生成 -->
          </div>
        </div>

        <!-- 3. 全屏模式 -->
        <div class="section-card">
          <h4>📺 全屏模式</h4>
          <button class="btn btn-primary" id="fullscreenToggleBtn" style="width:100%">开启/关闭全屏</button>
        </div>

        <!-- 4. 预设管理 -->
        <div class="section-card">
          <h4>💾 预设管理</h4>
          <div class="preset-input-row">
            <input type="text" id="presetNameInput" placeholder="输入预设名称">
            <button class="btn btn-success" id="savePresetBtn">保存预设</button>
          </div>
          <div class="preset-select-row">
            <select id="presetSelect">
              <option value="">-- 选择预设 --</option>
            </select>
            <button class="btn btn-primary" id="loadPresetBtn">替换预设</button>
          </div>
        </div>

        <!-- 5. 数据备份（【重点修复】加回了导入导出JSON功能） -->
        <div class="section-card">
          <h4>📦 数据备份</h4>
          <div class="btn-row">
            <button class="btn btn-primary" id="exportDataBtn">导出 JSON</button>
            <button class="btn btn-success" id="importDataBtn">导入 JSON</button>
          </div>
          <input type="file" id="importDataInput" accept=".json,application/json" style="display: none;">
        </div>
      </div>
    </div>

  </div>
</div>

<script>
  // ================= 1. 初始化与数据加载 =================
  const phoneCase = document.getElementById('phoneCase');
  const mainScreen = document.getElementById('mainScreen');
  const beautifyScreen = document.getElementById('beautifyScreen');

  const savedWallpaper = localStorage.getItem('saved_wallpaper');
  if (savedWallpaper) mainScreen.style.backgroundImage = `url(${savedWallpaper})`;

  const isFullscreen = localStorage.getItem('is_fullscreen') === 'true';
  if (isFullscreen) {
    phoneCase.classList.add('is-fullscreen');
    const fsBtn = document.getElementById('fullscreenToggleBtn');
    if(fsBtn) fsBtn.innerText = '关闭全屏';
  }

  const APP_ICON_KEY_PREFIX = 'app_icon_';
  const APP_NAME_KEY_PREFIX = 'app_name_';
  
  const appList = [
    { id: 'beautify', name: '美化' },
    { id: 'wechat', name: '微信' },
    { id: 'qqmusic', name: 'QQ音乐' },
    { id: 'persona', name: '人设' },
    { id: 'book', name: '世界书' },
    { id: 'play', name: '玩法' },
    { id: 'clock', name: 'Clock' },
    { id: 'instagram', name: 'Instagram' }
  ];

  // ================= 2. 初始化主屏幕 App 图标与名字 =================
  function applyAppConfig() {
    appList.forEach(app => {
      const savedName = localStorage.getItem(APP_NAME_KEY_PREFIX + app.id);
      if (savedName) {
        const labelEl = document.getElementById('label-' + app.id);
        if (labelEl) labelEl.innerText = savedName;
      }
      const savedIcon = localStorage.getItem(APP_ICON_KEY_PREFIX + app.id);
      if (savedIcon) {
        const iconBox = document.getElementById('app-icon-' + app.id);
        if (iconBox) {
          iconBox.innerHTML = `<img src="${savedIcon}" alt="${app.name}">`;
        }
      }
    });
  }
  applyAppConfig();

  // ================= 3. 界面切换逻辑 =================
  window.openBeautifyApp = function(event) {
    event.stopPropagation(); 
    mainScreen.style.display = 'none';
    beautifyScreen.style.display = 'block';
    renderAppEditList();
  };

  document.getElementById('backToMainBtn').addEventListener('click', () => {
    beautifyScreen.style.display = 'none';
    mainScreen.style.display = 'block';
  });

  // ================= 4. 壁纸更换与清除 =================
  const wallpaperInput = document.getElementById('wallpaperInput');
  document.getElementById('changeWallpaperBtn').addEventListener('click', () => wallpaperInput.click());
  wallpaperInput.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(event) {
      const base64Image = event.target.result;
      mainScreen.style.backgroundImage = `url(${base64Image})`;
      try { localStorage.setItem('saved_wallpaper', base64Image); } catch (err) { alert("壁纸图片过大"); }
    };
    reader.readAsDataURL(file);
  });
  document.getElementById('clearWallpaperBtn').addEventListener('click', () => {
    mainScreen.style.backgroundImage = '';
    localStorage.removeItem('saved_wallpaper');
  });

  // ================= 5. 全屏切换逻辑 =================
  document.getElementById('fullscreenToggleBtn').addEventListener('click', () => {
    const isNowFullscreen = phoneCase.classList.toggle('is-fullscreen');
    localStorage.setItem('is_fullscreen', isNowFullscreen);
    const btn = document.getElementById('fullscreenToggleBtn');
    if (isNowFullscreen) {
      btn.innerText = '关闭全屏';
      if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});
    } else {
      btn.innerText = '开启全屏';
      if (document.exitFullscreen) document.exitFullscreen().catch(()=>{});
    }
  });

  // ================= 6. 主屏幕组件上传 =================
  const uploadableIcons = document.querySelectorAll('.uploadable-icon');
  uploadableIcons.forEach(iconBox => {
    const fileInputIcon = iconBox.querySelector('.icon-file-input');
    const imgElement = iconBox.querySelector('.uploaded-icon-img');
    const svgElement = iconBox.querySelector('svg');
    const storageKey = 'uploaded_' + iconBox.getAttribute('data-key');
    iconBox.addEventListener('click', (e) => { if (e.target !== fileInputIcon) fileInputIcon.click(); });
    fileInputIcon.addEventListener('change', function(e) {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        const base64Image = event.target.result;
        svgElement.style.display = 'none'; imgElement.src = base64Image; imgElement.style.display = 'block';
        try { localStorage.setItem(storageKey, base64Image); } catch (err) {}
      };
      reader.readAsDataURL(file);
    });
    const savedIconImage = localStorage.getItem(storageKey);
    if (savedIconImage) { svgElement.style.display = 'none'; imgElement.src = savedIconImage; imgElement.style.display = 'block'; }
  });

  // 顶部大图上传
  const captchaBox = document.getElementById('captchaBox');
  const defaultIllustration = document.getElementById('defaultIllustration');
  const fileInput = document.getElementById('fileInput');
  const uploadedImage = document.getElementById('uploadedImage');
  captchaBox.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', function(e) {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = function(event) {
      const base64Image = event.target.result;
      defaultIllustration.style.display = 'none';
      uploadedImage.src = base64Image; uploadedImage.style.display = 'block';
      try { localStorage.setItem('uploaded_captcha_image', base64Image); } catch (err) {}
    };
    reader.readAsDataURL(file);
  });
  const savedImage = localStorage.getItem('uploaded_captcha_image');
  if (savedImage) { defaultIllustration.style.display = 'none'; uploadedImage.src = savedImage; uploadedImage.style.display = 'block'; }

  // 顶部文字双击
  const editableElements = document.querySelectorAll('.editable-text');
  editableElements.forEach(el => {
    el.addEventListener('dblclick', function() {
      this.contentEditable = "true"; this.focus();
    });
    el.addEventListener('blur', function() {
      this.contentEditable = "false";
      try { localStorage.setItem('edit_' + this.id, this.innerText); } catch (e) {}
    });
    const savedValue = localStorage.getItem('edit_' + el.id);
    if (savedValue) el.innerText = savedValue;
  });

  // ================= 7. 美化界面：App列表生成 =================
  const appEditList = document.getElementById('appEditList');

  function renderAppEditList() {
    let html = '';
    appList.forEach(app => {
      const savedName = localStorage.getItem(APP_NAME_KEY_PREFIX + app.id) || app.name;
      const savedIcon = localStorage.getItem(APP_ICON_KEY_PREFIX + app.id);
      
      let previewContent = '';
      if (savedIcon) {
        previewContent = `<img src="${savedIcon}" style="display:block;">`;
      } else {
        const mainIconBox = document.getElementById('app-icon-' + app.id);
        if (mainIconBox) {
          if (mainIconBox.innerHTML.trim() === '') {
            previewContent = `<svg viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 12h8M12 8v8"/></svg>`;
          } else {
            previewContent = mainIconBox.innerHTML;
          }
        }
      }

      html += `
        <div class="app-edit-item">
          <div class="app-edit-preview" data-id="${app.id}">
            ${previewContent}
          </div>
          <div class="app-edit-info">
            <input type="text" class="app-name-edit" data-id="${app.id}" value="${savedName}" placeholder="App名称">
          </div>
          <div class="app-edit-actions">
            <button class="upload-trigger" data-id="${app.id}">换图标</button>
          </div>
        </div>
      `;
    });
    appEditList.innerHTML = html;

    document.querySelectorAll('.app-edit-preview').forEach(preview => {
      preview.addEventListener('click', () => {
        const id = preview.getAttribute('data-id');
        triggerAppIconUpload(id, preview);
      });
    });

    document.querySelectorAll('.upload-trigger').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-id');
        const preview = document.querySelector(`.app-edit-preview[data-id="${id}"]`);
        triggerAppIconUpload(id, preview);
      });
    });

    document.querySelectorAll('.app-name-edit').forEach(input => {
      input.addEventListener('input', function() {
        const id = this.getAttribute('data-id');
        const newName = this.value;
        try { localStorage.setItem(APP_NAME_KEY_PREFIX + id, newName); } catch(e) {}
        const mainLabel = document.getElementById('label-' + id);
        if (mainLabel) mainLabel.innerText = newName;
      });
    });
  }

  function triggerAppIconUpload(appId, previewElement) {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = 'image/*';
    input.onchange = (e) => {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const base64 = ev.target.result;
        try { localStorage.setItem(APP_ICON_KEY_PREFIX + appId, base64); } catch (err) { alert("图片过大，存储失败"); return; }
        previewElement.innerHTML = `<img src="${base64}" style="display:block;">`;
        const mainIconBox = document.getElementById('app-icon-' + appId);
        if (mainIconBox) {
          mainIconBox.innerHTML = `<img src="${base64}" alt="App Icon">`;
        }
      };
      reader.readAsDataURL(file);
    };
    input.click();
  }

  renderAppEditList();

  // ================= 8. 预设管理 =================
  const presetSelect = document.getElementById('presetSelect');

  function updatePresetList() {
    presetSelect.innerHTML = '<option value="">-- 选择预设 --</option>';
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key.startsWith('preset_')) {
        presetSelect.innerHTML += `<option value="${key.replace('preset_', '')}">${key.replace('preset_', '')}</option>`;
      }
    }
  }
  updatePresetList();

  document.getElementById('savePresetBtn').addEventListener('click', () => {
    const name = document.getElementById('presetNameInput').value.trim();
    if (!name) return alert('请输入预设名称');
    const presetData = {};
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key.startsWith('saved_') || key.startsWith('uploaded_') || key.startsWith('edit_') || key.startsWith(APP_ICON_KEY_PREFIX) || key.startsWith(APP_NAME_KEY_PREFIX)) {
        presetData[key] = localStorage.getItem(key);
      }
    }
    try {
      localStorage.setItem('preset_' + name, JSON.stringify(presetData));
      alert('预设保存成功！');
      updatePresetList();
    } catch (e) { alert('预设保存失败，可能存储空间不足'); }
  });

  document.getElementById('loadPresetBtn').addEventListener('click', () => {
    const name = presetSelect.value;
    if (!name) return alert('请选择要替换的预设');
    const dataStr = localStorage.getItem('preset_' + name);
    if (!dataStr) return alert('未找到该预设');
    try {
      const data = JSON.parse(dataStr);
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key.startsWith('saved_') || key.startsWith('uploaded_') || key.startsWith('edit_') || key.startsWith(APP_ICON_KEY_PREFIX) || key.startsWith(APP_NAME_KEY_PREFIX)) {
          localStorage.removeItem(key);
        }
      }
      for (const key in data) {
        if (Object.prototype.hasOwnProperty.call(data, key)) {
          localStorage.setItem(key, data[key]);
        }
      }
      alert('预设替换成功！页面即将刷新。');
      location.reload();
    } catch (e) { alert('预设数据损坏'); }
  });

  // ================= 9. 数据备份（导入/导出JSON）【核心恢复区】 =================
  document.getElementById('exportDataBtn').addEventListener('click', () => {
    const data = {};
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      // 过滤出所有美化相关的键
      if (key.startsWith('saved_') || key.startsWith('uploaded_') || key.startsWith('edit_') || 
          key.startsWith(APP_ICON_KEY_PREFIX) || key.startsWith(APP_NAME_KEY_PREFIX)) {
        data[key] = localStorage.getItem(key);
      }
    }
    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `ai_phone_beautify_${new Date().getTime()}.json`;
    a.click();
    URL.revokeObjectURL(url);
  });

  document.getElementById('importDataBtn').addEventListener('click', () => {
    document.getElementById('importDataInput').click();
  });

  document.getElementById('importDataInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(event) {
      try {
        const data = JSON.parse(event.target.result);
        if (typeof data !== 'object' || data === null) throw new Error('Invalid JSON format');
        
        // 写入新数据（不清空旧的，只覆盖同名键，保证安全）
        for (const key in data) {
          if (Object.prototype.hasOwnProperty.call(data, key)) {
            localStorage.setItem(key, data[key]);
          }
        }
        alert('导入成功！页面即将重新加载以应用新的美化配置。');
        location.reload();
      } catch (err) {
        alert('导入失败，文件内容可能损坏或不是合法的 JSON 文件。');
        console.error('Import error:', err);
      }
    };
    reader.readAsText(file);
    this.value = ''; // 允许重复导入同一个文件
  });
</script>

</body>
</html>
